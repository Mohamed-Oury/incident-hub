<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="eodBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1726" />
      <stop offset="100%" stop-color="#240c1e" />
    </linearGradient>
  </defs>

  <rect width="800" height="450" rx="16" fill="url(#eodBg)" />
  <rect x="2" y="2" width="796" height="446" rx="14" fill="none" stroke="#334155" stroke-width="2" />

  <!-- Badge Top -->
  <rect x="40" y="35" width="310" height="32" rx="16" fill="#7d1538" fill-opacity="0.3" stroke="#f43f5e" stroke-width="1.5" />
  <text x="60" y="56" font-family="-apple-system, sans-serif" font-size="12" font-weight="800" fill="#fecdd3" letter-spacing="1">MODULE 5 : DIAGNOSTIC EOD BATCH</text>

  <!-- Title -->
  <text x="40" y="105" font-family="-apple-system, sans-serif" font-size="28" font-weight="900" fill="#ffffff">
    Chaîne d'Arrêté EOD &amp; Supervision d'Urgence
  </text>
  <text x="40" y="135" font-family="-apple-system, sans-serif" font-size="15" fill="#94a3b8">
    Séquencement des 10 étapes d'arrêté quotidien, levée des verrous SGBD et plans de reprise après incident.
  </text>

  <!-- Pipeline Steps Visual Mockup -->
  <g transform="translate(40, 175)">
    <!-- Step 1 -->
    <rect x="0" y="0" width="130" height="140" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="2" />
    <circle cx="25" cy="25" r="10" fill="#10b981" />
    <text x="22" y="29" font-family="sans-serif" font-size="11" font-weight="bold" fill="#ffffff">1</text>
    <text x="45" y="28" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" fill="#ffffff">Backup SGBD</text>
    <text x="15" y="60" font-family="monospace" font-size="10" fill="#cbd5e1">Dump Informix</text>
    <text x="15" y="80" font-family="monospace" font-size="10" fill="#10b981">STATUT : OK</text>
    <text x="15" y="115" font-family="-apple-system, sans-serif" font-size="10" fill="#94a3b8">Durée: 08m 12s</text>

    <!-- Step 2 -->
    <rect x="145" y="0" width="130" height="140" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="2" />
    <circle cx="170" cy="25" r="10" fill="#10b981" />
    <text x="167" y="29" font-family="sans-serif" font-size="11" font-weight="bold" fill="#ffffff">2</text>
    <text x="190" y="28" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" fill="#ffffff">Cut-off Agences</text>
    <text x="160" y="60" font-family="monospace" font-size="10" fill="#cbd5e1">BKEVE Vérif</text>
    <text x="160" y="80" font-family="monospace" font-size="10" fill="#10b981">STATUT : OK</text>
    <text x="160" y="115" font-family="-apple-system, sans-serif" font-size="10" fill="#94a3b8">Caisses équilibrées</text>

    <!-- Step 3 -->
    <rect x="290" y="0" width="130" height="140" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="2" />
    <circle cx="315" cy="25" r="10" fill="#10b981" />
    <text x="312" y="29" font-family="sans-serif" font-size="11" font-weight="bold" fill="#ffffff">3</text>
    <text x="335" y="28" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" fill="#ffffff">Compensation</text>
    <text x="305" y="60" font-family="monospace" font-size="10" fill="#cbd5e1">Clearing Visa</text>
    <text x="305" y="80" font-family="monospace" font-size="10" fill="#10b981">STATUT : OK</text>
    <text x="305" y="115" font-family="-apple-system, sans-serif" font-size="10" fill="#94a3b8">Fichiers VIF/IPM</text>

    <!-- Step 4 (Current / Warning) -->
    <rect x="435" y="0" width="140" height="140" rx="10" fill="#1e293b" stroke="#f59e0b" stroke-width="2" />
    <circle cx="460" cy="25" r="10" fill="#f59e0b" />
    <text x="457" y="29" font-family="sans-serif" font-size="11" font-weight="bold" fill="#ffffff">4</text>
    <text x="480" y="28" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" fill="#f59e0b">Intérêts BKCOM</text>
    <text x="450" y="60" font-family="monospace" font-size="10" fill="#cbd5e1">Calcul Découverts</text>
    <text x="450" y="80" font-family="monospace" font-size="10" fill="#f59e0b">EN COURS 84%</text>
    <text x="450" y="115" font-family="-apple-system, sans-serif" font-size="10" fill="#cbd5e1">Zéro Deadlock</text>

    <!-- Step 5 -->
    <rect x="590" y="0" width="130" height="140" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1.5" />
    <circle cx="615" cy="25" r="10" fill="#475569" />
    <text x="612" y="29" font-family="sans-serif" font-size="11" font-weight="bold" fill="#ffffff">5</text>
    <text x="635" y="28" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" fill="#94a3b8">BOD J+1</text>
    <text x="605" y="60" font-family="monospace" font-size="10" fill="#64748b">Ouverture Agences</text>
    <text x="605" y="80" font-family="monospace" font-size="10" fill="#64748b">EN ATTENTE</text>
    <text x="605" y="115" font-family="-apple-system, sans-serif" font-size="10" fill="#64748b">Prévu: 05h00</text>
  </g>

  <!-- Bottom Bar -->
  <rect x="40" y="355" width="720" height="55" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1" />
  <text x="60" y="388" font-family="-apple-system, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">
    Scénarios d'urgence :
  </text>
  <text x="215" y="388" font-family="-apple-system, sans-serif" font-size="13" fill="#cbd5e1">
    • Verrous ISAM -143 • Débordement Dbspace • Reprise au dernier checkpoint • Alerte temps réel
  </text>
</svg>
